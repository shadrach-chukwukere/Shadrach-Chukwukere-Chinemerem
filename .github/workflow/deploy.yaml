name: GitHub Actions Demo

# 1. Trigger: Run this workflow on every push to the main branch
on:
  push:
    branches: [main]

# 2. Execution: Define what the workflow actually does
jobs:
  explore-actions:
    # The type of runner (virtual machine) the job will run on
    runs-on: ubuntu-latest

    # The sequence of steps to execute
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Run a one-line script
        run: echo "Hello, GitHub Actions is successfully set up!"
